<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1522" media="(prefers-color-scheme: dark)">
<title>Gradus</title>

<style>
:root{
  --paper:#EDF0F4; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#18223B; --ink-2:#47526B; --muted:#76809A; --line:#D5DBE4;
  --ok:#2C7A50; --ko:#B3362B; --warn:#94650A; --focus:#3A5BA0;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  --sans:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#0F1522; --surface:#172033; --surface-2:#1C263B; --ink:#E4E9F2; --ink-2:#B0BACE; --muted:#8490A8; --line:#2B3650;
    --ok:#5DBB86; --ko:#E57368; --warn:#D9A441; --focus:#8FA8E0; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:6px}
.wrap{max-width:760px; margin:0 auto; padding:0 18px}

header.top{position:sticky; top:0; z-index:10; background:color-mix(in srgb, var(--paper) 90%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); padding-top:env(safe-area-inset-top,0px); border-bottom:1px solid var(--line)}
header.top .wrap{display:flex; align-items:center; justify-content:space-between; height:56px}
.brand{display:flex; align-items:center; gap:9px; font-family:var(--serif); font-size:25px; font-weight:600; letter-spacing:-.01em; text-decoration:none}
.brand svg{width:22px; height:22px}
.sync{font-size:12.5px; color:var(--muted); text-decoration:none; display:flex; align-items:center; gap:6px}
.sync i{width:7px; height:7px; border-radius:50%; background:var(--muted); display:inline-block}
.sync.on i{background:var(--ok)}

main{padding:22px 0 calc(110px + env(safe-area-inset-bottom,0px))}
h1.page{font-family:var(--serif); font-weight:500; font-size:clamp(32px,7.5vw,46px); line-height:1.06; letter-spacing:-.018em; margin:6px 0 10px}
h2.sec{font-family:var(--serif); font-weight:500; font-size:23px; letter-spacing:-.01em; margin:34px 0 10px}
.lede{color:var(--ink-2); margin:0 0 10px; max-width:62ch; font-size:16.5px}
.muted{color:var(--muted)}
.small{font-size:14px}
.date{color:var(--muted); font-size:14.5px; margin:0}
.back{display:inline-flex; align-items:center; gap:4px; color:var(--ink-2); text-decoration:none; font-size:14.5px; font-weight:600}
.back svg{width:16px; height:16px}

nav.bottom{position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom .wrap{display:grid; grid-template-columns:repeat(5,1fr); padding:0 6px}
nav.bottom a{display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 0 8px; font-size:11.5px; font-weight:600; color:var(--muted); text-decoration:none}
nav.bottom a svg{width:22px; height:22px}
nav.bottom a[aria-current="page"]{color:var(--ink)}

.btn{font:inherit; font-weight:700; font-size:15px; border-radius:10px; border:1px solid var(--ink); background:var(--ink); color:var(--paper); padding:11px 16px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line)}
.btn.danger{background:transparent; color:var(--ko); border-color:color-mix(in srgb, var(--ko) 45%, var(--line))}
.btn.small{padding:7px 12px; font-size:13.5px; border-radius:8px}
.btn:disabled{opacity:.45; cursor:default}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.linkbtn{background:none; border:0; padding:0; font:inherit; color:var(--ink-2); text-decoration:underline; text-underline-offset:3px; cursor:pointer; font-size:14px}

input,textarea,select{font:inherit; font-size:16px; color:var(--ink); background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; width:100%}
textarea{resize:vertical; line-height:1.45}
label.f{display:block; margin:12px 0}
label.f > span{display:block; font-size:14px; font-weight:600; color:var(--ink-2); margin-bottom:5px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.check{display:flex; gap:10px; align-items:center; font-size:15px; margin:10px 0}
.check input{width:20px; height:20px; accent-color:var(--ink)}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 16px}
.panel + .panel{margin-top:12px}

/* Scale: il segno distintivo */
.stairs svg{display:block; width:100%; height:auto; color:var(--ink-2); overflow:visible}
.stairs .fill{transform-box:fill-box; transform-origin:50% 100%; animation:rise .9s cubic-bezier(.2,.75,.25,1) both}
@keyframes rise{from{transform:scaleY(0)}}
.stairs-labels{display:grid; margin-top:7px; gap:4px}
.stairs-labels div{font-size:12.5px; line-height:1.3; color:var(--ink-2)}
.stairs-labels b{display:block; font-weight:600; color:var(--ink)}
.stairs.big .stairs-labels div{font-size:13.5px}
.stairs.big .stairs-labels b{font-family:var(--serif); font-size:18px; font-weight:500}

.area-row{display:block; text-decoration:none; padding:18px 0 20px; border-top:1px solid var(--line)}
.area-row:last-child{border-bottom:1px solid var(--line)}
.area-head{display:flex; align-items:baseline; gap:10px; margin-bottom:12px}
.area-name{font-family:var(--serif); font-size:23px; font-weight:500; letter-spacing:-.01em}
.area-meta{margin-left:auto; font-size:13px; color:var(--muted)}
.swatch{width:11px; height:11px; border-radius:3px; background:var(--c); flex:none; transform:translateY(-1px)}
.area-desc{color:var(--ink-2); font-size:15px; margin:-6px 0 12px}

.sugg{display:flex; align-items:center; gap:14px; text-decoration:none; padding:14px 16px; background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--c); border-radius:4px 12px 12px 4px; margin:10px 0}
.sugg-t{font-family:var(--serif); font-size:19px; line-height:1.25}
.sugg-m{font-size:13px; color:var(--muted); margin-top:2px}
.sugg .go{margin-left:auto; font-weight:700; font-size:14px; white-space:nowrap}

.seg{display:flex; gap:6px; flex-wrap:wrap; margin:18px 0 6px}
.seg button{font:inherit; font-size:14.5px; font-weight:600; border:1px solid var(--line); background:var(--surface); color:var(--ink-2); border-radius:999px; padding:7px 14px; cursor:pointer; display:inline-flex; align-items:center; gap:6px}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.seg svg{width:13px; height:13px}

.lrow{display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid var(--line); text-decoration:none}
.lrow.locked{opacity:.5}
.lrow-t{font-family:var(--serif); font-size:19px; line-height:1.25}
.lrow-m{display:flex; gap:12px; flex-wrap:wrap; font-size:13px; color:var(--muted); margin-top:3px}
.badge{margin-left:auto; flex:none; font-size:13px; font-weight:700; padding:4px 9px; border-radius:6px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-2)}
.badge.ok{color:var(--ok); border-color:color-mix(in srgb, var(--ok) 40%, var(--line))}
.badge.low{color:var(--warn); border-color:color-mix(in srgb, var(--warn) 40%, var(--line))}
.note{font-size:14.5px; color:var(--ink-2); background:var(--surface); border:1px dashed var(--line); border-radius:10px; padding:12px 14px; margin:12px 0}
h3.mod{font-family:var(--sans); font-size:14px; font-weight:700; color:var(--ink-2); margin:24px 0 0; padding-left:10px; border-left:3px solid var(--c, var(--line))}

/* Lezione */
.lesson-meta{display:flex; gap:14px; flex-wrap:wrap; font-size:14px; color:var(--muted); margin-bottom:6px}
.teoria{font-family:var(--serif); font-size:19px; line-height:1.62; max-width:66ch}
.teoria h3{font-size:24px; font-weight:600; line-height:1.2; letter-spacing:-.01em; margin:30px 0 8px}
.teoria h4{font-size:20px; font-weight:600; margin:22px 0 6px}
.teoria p{margin:0 0 12px}
.teoria ul,.teoria ol{margin:0 0 14px; padding-left:22px}
.teoria li{margin:4px 0}
.teoria code{font-family:var(--mono); font-size:.8em; background:var(--surface); border:1px solid var(--line); padding:1px 6px; border-radius:5px}
.teoria p.formula{margin:10px 0 16px}
.teoria p.formula code{display:inline-block; font-size:.82em; padding:8px 12px; border-left:3px solid var(--c); border-radius:3px 8px 8px 3px}
.teoria blockquote{margin:20px 0; padding:12px 16px; background:var(--surface); border-left:3px solid var(--c); border-radius:3px 10px 10px 3px; font-size:17.5px; color:var(--ink-2)}
.tbl{overflow-x:auto; margin:10px 0 16px}
.teoria table{border-collapse:collapse; font-family:var(--sans); font-size:14.5px; min-width:100%}
.teoria th,.teoria td{border-bottom:1px solid var(--line); padding:7px 10px; text-align:left; white-space:nowrap}
.teoria th{font-weight:700; color:var(--ink-2)}

.vocab{width:100%; border-collapse:collapse; font-size:15px}
.vocab td{padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top}
.vocab td:first-child{font-family:var(--serif); font-size:17px; width:44%}
.vocab .es{display:block; font-size:13.5px; color:var(--muted); font-family:var(--sans)}

.ex{padding:20px 0; border-top:1px solid var(--line)}
.ex-head{display:flex; align-items:center; gap:10px; margin-bottom:6px}
.ex-n{font-family:var(--serif); font-size:15px; color:var(--muted)}
.ex-q{font-size:17px; line-height:1.5; margin:0 0 10px; font-weight:500}
.mark{font-size:13px; font-weight:700}
.mark.ok{color:var(--ok)} .mark.ko{color:var(--ko)} .mark.wait{color:var(--warn)}
.opt{display:block; width:100%; text-align:left; font:inherit; font-size:16px; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:11px 14px; margin:7px 0; cursor:pointer}
.opt.sel{border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink)}
.opt.good{border-color:var(--ok); background:color-mix(in srgb, var(--ok) 11%, var(--surface)); box-shadow:none}
.opt.bad{border-color:var(--ko); background:color-mix(in srgb, var(--ko) 10%, var(--surface)); box-shadow:none}
.opt:disabled{cursor:default; color:var(--ink)}
.vf{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.vf .opt{text-align:center; margin:0}
.num{display:flex; align-items:center; gap:10px; max-width:320px}
.num .unit{color:var(--ink-2); font-weight:600}
input.gap{display:inline-block; width:9.5em; padding:4px 8px; margin:0 4px; font-size:16px; border-radius:7px; vertical-align:baseline}
.spieg{margin:12px 0 0; font-size:15px; color:var(--ink-2); padding-left:12px; border-left:2px solid var(--line)}
.sol{margin:8px 0 0; font-size:15px}
.grade{margin-top:12px; display:grid; gap:8px}

.result{margin:28px 0 8px; padding:20px; background:var(--surface); border:1px solid var(--line); border-radius:16px}
.score{font-family:var(--serif); font-size:68px; line-height:1; font-weight:500; letter-spacing:-.02em}
.score small{font-size:24px; color:var(--muted); margin-left:4px}

/* Ripasso */
.card{min-height:230px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:28px 20px; margin:14px 0}
.card .front{font-family:var(--serif); font-size:clamp(28px,8vw,40px); line-height:1.15}
.card .back{font-size:19px; color:var(--ink-2)}
.card .esempio{font-family:var(--serif); font-style:italic; color:var(--muted); font-size:16.5px; max-width:40ch}
.boxes{display:flex; height:10px; border-radius:5px; overflow:hidden; background:var(--surface-2); border:1px solid var(--line); margin:10px 0 6px}
.boxes span{display:block; height:100%}
.wlist{list-style:none; padding:0; margin:8px 0}
.wlist li{display:flex; gap:10px; align-items:baseline; padding:8px 0; border-bottom:1px solid var(--line); font-size:15px}
.wlist li b{font-family:var(--serif); font-weight:500; font-size:16.5px}
.wlist li button{margin-left:auto}

.steps{counter-reset:s}
.step{position:relative; padding:4px 0 8px 44px; margin:18px 0}
.step::before{counter-increment:s; content:counter(s); position:absolute; left:0; top:0; width:30px; height:30px; border-radius:50%; border:1px solid var(--ink); font-family:var(--serif); font-size:17px; display:flex; align-items:center; justify-content:center}
.step h3{font-family:var(--serif); font-weight:500; font-size:21px; margin:0 0 6px}
pre.code{font-family:var(--mono); font-size:13px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; overflow-x:auto; white-space:pre}
details summary{cursor:pointer; font-weight:600; font-size:14.5px; color:var(--ink-2); margin:8px 0}
.err{color:var(--ko); font-size:14.5px}
.okmsg{color:var(--ok); font-size:14.5px; font-weight:600}

.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(78px + env(safe-area-inset-bottom,0px)); z-index:30; background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:10px; font-size:14.5px; max-width:92vw; box-shadow:0 6px 24px rgba(10,20,40,.25)}
.center{min-height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px}
.login{width:100%; max-width:380px; text-align:left}

svg.board{display:block; width:100%; max-width:420px; height:auto; border-radius:6px; box-shadow:0 1px 0 var(--line), 0 6px 18px rgba(20,20,30,.12); user-select:none; -webkit-user-select:none}
.sq-l{fill:#EFE5D2} .sq-d{fill:#B58863}
.sq-last{fill:#E2C14A; fill-opacity:.42} .sq-sel{fill:#5C8FD6; fill-opacity:.45}
.sq-dot{fill:#1d2533; fill-opacity:.28} .sq-cap{fill:none; stroke:#1d2533; stroke-opacity:.35; stroke-width:3}
.pz{font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2","DejaVu Sans",serif; font-size:37px; text-anchor:middle; dominant-baseline:central; paint-order:stroke; pointer-events:none}
.pz-w{fill:#FFFFFF; stroke:#1B1B1B; stroke-width:1.5px} .pz-b{fill:#1B1B1B; stroke:#1B1B1B; stroke-width:.6px}
.coord{font-family:var(--sans); font-size:9.5px; font-weight:700; pointer-events:none} .coord.on-l{fill:#B58863} .coord.on-d{fill:#EFE5D2}
figure.diagram{margin:14px 0 18px} figure.diagram figcaption{font-family:var(--sans); font-size:14px; color:var(--muted); margin-top:8px}
.mossa{margin-top:6px}
.teoria pre.code{font-size:13px; line-height:1.5; margin:10px 0 16px}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }
</style>
</head>

/* ================= Utilità ================= */
const T = (...l) => l.join("\n");
const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const today = () => ymd(new Date());
const addDays = (s, n) => { const [y, m, d] = s.split("-").map(Number); const x = new Date(y, m - 1, d); x.setDate(x.getDate() + n); return ymd(x); };
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const shuffle = (a) => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const fmtNum = (v) => Number(v).toLocaleString("it-IT", { maximumFractionDigits: 4 });

  if (s === undefined || s === null) return null;
  let t = String(s).trim().replace(/[−–]/g, "-").replace(/[€%\s]/g, "").replace(/[a-zA-Z]/g, "");
  if (!t) return null;

function norm(s) {

/* Mini markdown: ## titoli, - elenchi, 1. elenchi, > nota, | tabelle, **grassetto**, *corsivo*, `formula` */
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
function renderMd(md) {
  const lines = String(md || "").split("\n");

  while (i < lines.length) {

    if (line.trim().startsWith("```")) {
      const code = []; i++;
      while (i < lines.length && !lines[i].trim().startsWith("```")) { code.push(lines[i]); i++; }
      i++; html += '<pre class="code">' + esc(code.join("\n")) + "</pre>"; continue;
    }
    if (!line.trim()) { i++; continue; }
    if (line.startsWith("### ")) { html += "<h4>" + inline(line.slice(4)) + "</h4>"; i++; continue; }
    if (line.startsWith("## ")) { html += "<h3>" + inline(line.slice(3)) + "</h3>"; i++; continue; }
    if (isUl(line)) { html += "<ul>"; while (i < lines.length && isUl(lines[i])) { html += "<li>" + inline(lines[i].replace(/^\s*[-•]\s+/, "")) + "</li>"; i++; } html += "</ul>"; continue; }
    if (isOl(line)) { html += "<ol>"; while (i < lines.length && isOl(lines[i])) { html += "<li>" + inline(lines[i].replace(/^\s*\d+[.)]\s+/, "")) + "</li>"; i++; } html += "</ol>"; continue; }
    if (line.startsWith(">")) { const q = []; while (i < lines.length && lines[i].startsWith(">")) { q.push(lines[i].replace(/^>\s?/, "")); i++; } html += "<blockquote>" + inline(q.join(" ")) + "</blockquote>"; continue; }
    if (line.trim().startsWith("|")) {
      const rows = []; while (i < lines.length && lines[i].trim().startsWith("|")) { rows.push(lines[i].trim()); i++; }
      const cells = (r) => r.replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
      const body = rows.filter((r) => !/^\|?\s*:?-{2,}/.test(r));
      if (body.length) html += '<div class="tbl"><table><thead><tr>' + cells(body[0]).map((c) => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>" +
        body.slice(1).map((r) => "<tr>" + cells(r).map((c) => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>";
      continue;
    }
    if (/^\s*`[^`]+`\s*$/.test(line)) { html += '<p class="formula">' + inline(line.trim()) + "</p>"; i++; continue; }
    html += "<p>" + inline(line) + "</p>"; i++;
  }
  return html;
}

/* ================= Dati ================= */
const KEYS = ["areas", "lessons", "progress", "vocab", "settings", "meta", "sblocchi", "attivita", "tattica"];
function normalize(v) { v = v || {}; const o = {}; KEYS.forEach((k) => { o[k] = v[k] && typeof v[k] === "object" ? v[k] : {}; }); return o; }
function setIn(obj, path, value) {
  const keys = path.split("/");
  const root = { ...obj };
  let cur = root;
  for (let i = 0; i < keys.length - 1; i++) {
    const k = keys[i];
    cur[k] = cur[k] && typeof cur[k] === "object" && !Array.isArray(cur[k]) ? { ...cur[k] } : {};
    cur = cur[k];
  }
  const last = keys[keys.length - 1];
  if (value === null || value === undefined) delete cur[last]; else cur[last] = value;
  return root;
}
const applyUpdates = (obj, upd) => normalize(Object.keys(upd).reduce((acc, p) => setIn(acc, p, upd[p]), obj));
function clean(upd) { const o = {}; Object.keys(upd).forEach((k) => { const v = upd[k]; o[k] = v === null || v === undefined ? null : JSON.parse(JSON.stringify(v)); }); return o; }

function seedUpdates(d) {
  const ver = d.meta.seedVersion || 0;
  if (ver >= SEED_VERSION) return null;
  const upd = {};
  Object.values(SEED_AREAS).forEach((a) => {
    const cur = d.areas[a.id];
    if (!cur) upd["areas/" + a.id] = a;
    else if (ver < 2 && a.id === "controllo") upd["areas/controllo"] = { ...cur, nome: a.nome, descrizione: a.descrizione, livelli: a.livelli, moduli: a.moduli };
  });
  SEED_LESSONS.forEach((l) => {
    const cur = d.lessons[l.id];
    if (!cur) { if ((l.v || 1) > ver) upd["lessons/" + l.id] = { ...l, creata: today(), origine: "iniziale" }; }
    else {
      if (l.modulo && cur.modulo !== l.modulo) upd["lessons/" + l.id + "/modulo"] = l.modulo;
      if ((l.rev || 1) > (cur.rev || 1)) { upd["lessons/" + l.id + "/teoria"] = l.teoria; upd["lessons/" + l.id + "/rev"] = l.rev; }
    }
  });
  upd["meta/seedVersion"] = SEED_VERSION;
  return upd;
}

const opts = (d) => ({ soglia: Number(d.settings.soglia) || 70, blocco: d.settings.bloccoLivelli !== false, profilo: d.settings.profilo || PROFILO_DEFAULT });
const areaList = (d) => Object.values(d.areas).filter((a) => a && a.id).sort((a, b) => (a.ordine || 99) - (b.ordine || 99) || String(a.nome).localeCompare(String(b.nome)));
const livelliOf = (a) => (Array.isArray(a.livelli) && a.livelli.length ? a.livelli : ["Base", "Intermedio", "Avanzato"]);
const moduliOf = (a) => (a && Array.isArray(a.moduli) ? a.moduli.filter((m) => m && m.id) : []);
const lessonsOf = (d, areaId, livello) => Object.values(d.lessons)
  .filter((l) => l && l.area === areaId && (!livello || l.livello === livello))
  .sort((a, b) => (a.ordine || 0) - (b.ordine || 0) || String(a.creata || "").localeCompare(String(b.creata || "")) || String(a.titolo).localeCompare(String(b.titolo)));
function levelStats(d, a, liv) {
  const ls = lessonsOf(d, a.id, liv);
  const done = ls.filter((l) => d.progress[l.id]);
  const sum = done.reduce((s, l) => s + (d.progress[l.id].best || 0), 0);
  return { tot: ls.length, done: done.length, avg: done.length ? sum / done.length : 0, progress: ls.length ? sum / (ls.length * 100) : 0 };
}
function isUnlocked(d, a, i) {
  if (i === 0 || !opts(d).blocco) return true;
  return i <= (d.sblocchi[a.id] || 0);
}
function levelPassed(d, a, i) {
  const st = levelStats(d, a, livelliOf(a)[i]);
  if (st.tot === 0) return true;
  return st.done === st.tot && st.avg >= opts(d).soglia;
}
function streak(att) { let n = 0; let d = today(); if (!att[d]) d = addDays(d, -1); while (att[d]) { n++; d = addDays(d, -1); } return n; }

/* ================= Correzione ================= */
function grade(ex, ans) {
  switch (ex.tipo) {
    case "multipla": return { punti: ans !== undefined && ans !== "" && Number(ans) === Number(ex.risposta) ? 1 : 0 };

}

}

const COLORI = ["#1F7A6B", "#A23B72", "#B07A1F", "#3A5BA0", "#6B4FA0", "#2F6F8F", "#8A4B2A", "#4F7A2A"];
function parseImport(text, d) {
  let s = String(text || "").trim().replace(/^```(?:json)?/i, "").replace(/```\s*$/, "").trim();
  const start = s.search(/[\[{]/); if (start > 0) s = s.slice(start);
  let j;
  try { j = JSON.parse(s); } catch (e) { throw new Error("Il testo non è JSON valido. Copia la risposta di Claude per intero, dalla prima all'ultima parentesi graffa."); }
  const aree = [], lezioni = [], vocaboli = [];
  if (Array.isArray(j)) lezioni.push(...j);
  else {
    if (j.area && typeof j.area === "object") aree.push(j.area);
    if (Array.isArray(j.aree)) aree.push(...j.aree);
    if (Array.isArray(j.lezioni)) lezioni.push(...j.lezioni);
    if (Array.isArray(j.lessons)) lezioni.push(...j.lessons);
    if (j.lezione) lezioni.push(j.lezione);
    if (j.titolo && Array.isArray(j.esercizi)) lezioni.push(j);
    if (!j.titolo && Array.isArray(j.vocaboli)) vocaboli.push(...j.vocaboli);
  }
  const upd = {}, errors = [], known = { ...d.areas };
  let nAree = 0, nLez = 0, nVoc = 0; const dove = {};
  aree.forEach((a) => {
    if (!a || !a.nome) { errors.push("Un'area non ha il nome e non è stata importata."); return; }
    const id = slug(a.id || a.nome);
    const area = {
      id, nome: String(a.nome), descrizione: String(a.descrizione || ""),
      colore: /^#[0-9a-f]{6}$/i.test(a.colore || "") ? a.colore : COLORI[Object.keys(known).length % COLORI.length],
      livelli: Array.isArray(a.livelli) && a.livelli.length ? a.livelli.map(String) : ["Base", "Intermedio", "Avanzato"],
      ordine: known[id] ? known[id].ordine : Object.keys(known).length + 1,
    };
    const mm = (Array.isArray(a.moduli) ? a.moduli : []).map((m) => (typeof m === "string" ? { id: slug(m), nome: m } : m && (m.id || m.nome) ? { id: slug(m.id || m.nome), nome: String(m.nome || m.id) } : null)).filter(Boolean);
    if (mm.length) area.moduli = mm;
    known[id] = area; upd["areas/" + id] = area; nAree++;
  });
  const nuoviModuli = {};
  lezioni.forEach((l, k) => {
    if (!l || !l.titolo) { errors.push(`Lezione ${k + 1}: manca il titolo.`); return; }
    const key = slug(l.area || "");
    const area = known[key] || Object.values(known).find((a) => slug(a.nome) === key);
    if (!area) { errors.push(`«${l.titolo}»: l'area «${l.area}» non esiste. Creala prima o correggi il campo area.`); return; }
    const livs = livelliOf(area);
    const liv = livs.find((x) => String(x).toLowerCase() === String(l.livello || "").toLowerCase()) || livs[0];
    let modulo = "";
    if (l.modulo) {
      const mods = nuoviModuli[area.id] || moduliOf(area);
      const key = slug(l.modulo);
      const found = mods.find((m) => m.id === key || slug(m.nome) === key);
      if (found) modulo = found.id;
      else { modulo = key; nuoviModuli[area.id] = [...mods, { id: key, nome: String(l.modulo) }]; }
    }
    let scartati = 0;
    const esercizi = (Array.isArray(l.esercizi) ? l.esercizi : []).filter((e) => e && e.tipo && e.domanda).filter((e) => {
      if (e.tipo !== "mossa") return true;
      const ok = validaMossa(e); if (!ok) scartati++; return ok;
    });
    if (scartati) errors.push(`«${l.titolo}»: ${scartati === 1 ? "un esercizio di scacchi scartato" : scartati + " esercizi di scacchi scartati"} perché la posizione o le mosse non sono legali.`);
    if (!esercizi.length) errors.push(`«${l.titolo}»: nessun esercizio valido, importata solo la teoria.`);
    let id = slug(area.id + "-" + l.titolo);
    while (d.lessons[id] || upd["lessons/" + id]) id = slug(area.id + "-" + l.titolo) + "-" + Math.random().toString(36).slice(2, 5);
    upd["lessons/" + id] = {
      id, area: area.id, livello: liv, modulo, titolo: String(l.titolo), argomento: String(l.argomento || ""), minuti: Number(l.minuti) || 15,
      teoria: String(l.teoria || ""), vocaboli: Array.isArray(l.vocaboli) ? l.vocaboli.filter((v) => v && v.de && v.it) : [],
      esercizi, creata: today(), origine: "claude",
    };
    nLez++; dove[area.id + "|" + liv] = { area: area.id, nome: area.nome, liv };
  });
  Object.keys(nuoviModuli).forEach((aid) => {
    if (upd["areas/" + aid]) upd["areas/" + aid] = { ...upd["areas/" + aid], moduli: nuoviModuli[aid] };
    else upd["areas/" + aid + "/moduli"] = nuoviModuli[aid];
  });
  vocaboli.forEach((v) => { if (v && v.de && v.it) { const id = slug(v.de); upd["vocab/" + id] = { id, de: v.de, it: v.it, esempio: v.esempio || "", box: 1, due: today(), creata: today() }; nVoc++; } });
  if (!nAree && !nLez && !nVoc && !errors.length) errors.push("Non ho trovato aree, lezioni o vocaboli nel testo.");
  return { upd, errors, nAree, nLez, nVoc, dove: Object.values(dove) };
}

  let c; try { c = JSON.parse(body); } catch (e) { throw new Error("La configurazione non è leggibile. Incolla l'oggetto firebaseConfig così com'è."); }

function Stairs({ area, data, big }) {

  return (
    <div className={"stairs" + (big ? " big" : "")}>
      <svg viewBox={`0 0 ${W} ${H}`} role="img" aria-label={`${area.nome}: ` + info.map((x) => `${x.lv} ${Math.round(x.st.progress * 100)}%`).join(", ")}>
        {info.map((x, i) => {

          return (
            <g key={x.lv}>

              {fh > 0 && <rect className="fill" style={{ animationDelay: i * 120 + "ms" }} x={xx} y={H - fh} width={w} height={fh} rx="3" fill={area.colore} />}
              {!x.un && <g transform={`translate(${xx + w / 2 - 6},${y + h / 2 - 8})`} stroke="currentColor" fill="none" strokeWidth="1.5" opacity=".6"><rect x="0.75" y="6" width="10.5" height="8.5" rx="1.5" /><path d="M3 6V4a3 3 0 0 1 6 0v2" /></g>}
            </g>
          );
        })}
      </svg>

  const g = gRef.current;

  const flip = /\sb(\s|$)/.test(ex.fen);
  const chiuso = !!value || locked;
  const pulisci = (x) => String(x).replace(/[+#!?]/g, "");
  const gioca = (mv) => {
    const res = g.move({ from: mv.from, to: mv.to, promotion: mv.promotion });
    setSel(null);
    if (!res) return;
    setFen(g.fen()); setLast([res.from, res.to]);

    const next = step + 1;
    if (next >= sol.length) { setStep(next); setMsg(`${sanIt(res.san)}: esatto!`); onChange("ok"); return; }
    setStep(next); setMsg(`${sanIt(res.san)}: giusto, continua.`);

      if (!r2) return;

    }, 450);

    if (chiuso) return;
    if (sel) {
      if (sq === sel) { setSel(null); return; }
      const cand = g.moves({ square: sel, verbose: true }).filter((m) => m.to === sq);

        let mv = cand[0];

    <div className="mossa">

      <p className={"small " + (value === "ok" ? "okmsg" : String(value || "").startsWith("ko:") ? "err" : "muted")} style={{ margin: "8px 0 0" }}>{msg || `${tratto}. Tocca un pezzo, poi la casa di arrivo.`}</p>
    </div>

function puzzleFromApi(j) {

async function fetchPuzzle(tema, diff) {

  return puzzleFromApi(await r.json());

      ? <p className="ex-q">{parts[0]}{inp}{parts.slice(1).join("___")}</p>
      : <><p className="ex-q">{ex.domanda}</p>{inp}</>;
  } else if (ex.tipo === "mossa") {
    body = <MossaEx ex={ex} value={value} onChange={onChange} locked={done} />;
  } else if (aperta) {
    body = <textarea rows={5} value={value || ""} disabled={done} placeholder="Scrivi qui la tua risposta" aria-label={`Risposta all'esercizio ${i + 1}`} onChange={(e) => onChange(e.target.value)} />;
  }
  return (
    <section className="ex">
      <div className="ex-head">
        <span className="ex-n">Esercizio {i + 1}</span>
        {done && !aperta && <span className={"mark " + (ok ? "ok" : "ko")}>{ok ? "Corretto" : "Da rivedere"}</span>}
        {done && aperta && (voto ? <span className="mark ok">Voto {voto.voto}/100</span> : <span className="mark wait">Da valutare</span>)}
      </div>
      {ex.tipo !== "completa" && <p className="ex-q">{ex.domanda}</p>}
      {body}
      {done && !aperta && !ok && <p className="sol"><b>Risposta corretta:</b> {fmtCorrect(ex)}</p>}
      {done && aperta && !voto && (
        <div className="grade">
          <p className="muted small" style={{ margin: 0 }}>Questa risposta la valuta Claude: copia la richiesta, incollala in una chat e riporta qui il risultato. Puoi anche scrivere direttamente un voto da 0 a 100.</p>
          <div className="row"><button className="btn small ghost" onClick={onCopia}>Copia per la correzione</button><a className="btn small ghost" href="https://claude.ai/new" target="_blank" rel="noopener">Apri Claude</a></div>
          <textarea rows={3} value={draft || ""} placeholder="Incolla qui la risposta di Claude" onChange={(e) => onDraft(e.target.value)} />
          <div><button className="btn small" disabled={!draft} onClick={onVoto}>Registra il voto</button></div>
        </div>
      )}
      {done && aperta && voto && voto.commento && <p className="spieg" style={{ whiteSpace: "pre-wrap" }}>{voto.commento}</p>}
      {done && ex.spiegazione && <p className="spieg">{aperta ? "Traccia: " : ""}{ex.spiegazione}</p>}
    </section>
  );
}

function Lezione({ data, id, apply, notify }) {
  const l = data.lessons[id];
  const [ans, setAns] = useState({});
  const [res, setRes] = useState(null);
  const [voti, setVoti] = useState({});
  const [draft, setDraft] = useState({});
  const [tentativo, setTentativo] = useState(0);
  if (!l) return <><p className="lede">Questa lezione non esiste più.</p><a className="btn ghost" href="#/aree">Vai alle aree</a></>;
  const area = data.areas[l.area] || { id: l.area, nome: l.area, colore: "#47526B", livelli: [] };
  const es = Array.isArray(l.esercizi) ? l.esercizi : [];
  const o = opts(data);
  const p = data.progress[id];
  const vocaboli = Array.isArray(l.vocaboli) ? l.vocaboli : [];
  const nuove = vocaboli.filter((v) => !data.vocab[slug(v.de)]);

  const scoreOf = (esiti, v) => es.length ? es.reduce((s, ex, i) => s + (ex.tipo === "aperta" ? (v[i] ? v[i].voto / 100 : 0) : esiti[i].punti), 0) / es.length * 100 : 0;
  const save = (esiti, v, ts) => {
    const score = Math.round(scoreOf(esiti, v));
    const errori = es.map((ex, i) => (ex.tipo !== "aperta" && !esiti[i].punti ? i : -1)).filter((i) => i >= 0);
    const prev = data.progress[id] || {};
    let storico = (prev.storico || []).filter((x) => x.t !== ts);
    storico.push({ t: ts, d: today(), p: score });
    storico = storico.slice(-30);
    apply({
      ["progress/" + id]: { best: Math.max(...storico.map((x) => x.p)), last: score, storico, errori, ultimo: today() },
      ["attivita/" + today()]: true,
    });
  };
  const correggi = () => {
    const vuoti = es.filter((ex, i) => ans[i] === undefined || String(ans[i]).trim() === "").length;
    if (vuoti && !confirm(`${vuoti} ${vuoti === 1 ? "esercizio è" : "esercizi sono"} senza risposta. Correggere comunque?`)) return;
    const esiti = es.map((ex, i) => grade(ex, ans[i]));
    const ts = Date.now();
    setRes({ esiti, ts });
    save(esiti, voti, ts);
    setTimeout(() => { const el = document.getElementById("risultato"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }, 60);
  };
  const riprova = () => { setAns({}); setRes(null); setVoti({}); setDraft({}); setTentativo((t) => t + 1); const el = document.getElementById("esercizi"); if (el) el.scrollIntoView({ block: "start" }); };
  const registra = (i) => {
    const v = parseVoto(draft[i]);
    if (!v) { notify("Non trovo un voto: incolla la risposta di Claude o scrivi un numero da 0 a 100."); return; }
    const nv = { ...voti, [i]: v }; setVoti(nv); save(res.esiti, nv, res.ts);
  };
  const aggiungiVocaboli = () => {
    const upd = {};
    nuove.forEach((v) => { const vid = slug(v.de); upd["vocab/" + vid] = { id: vid, de: v.de, it: v.it, esempio: v.esempio || "", box: 1, due: today(), creata: today(), lezione: id }; });
    apply(upd); notify(`${nuove.length} ${nuove.length === 1 ? "parola aggiunta" : "parole aggiunte"} al ripasso.`);
  };
  const elimina = () => {
    if (!confirm(`Eliminare la lezione «${l.titolo}» e i suoi risultati?`)) return;
    apply({ ["lessons/" + id]: null, ["progress/" + id]: null });
    go("area/" + area.id);
  };
  const score = res ? Math.round(scoreOf(res.esiti, voti)) : 0;
  const pending = res ? es.filter((ex, i) => ex.tipo === "aperta" && !voti[i]).length : 0;
  const errori = res ? es.map((ex, i) => (ex.tipo !== "aperta" && !res.esiti[i].punti ? i : -1)).filter((i) => i >= 0) : [];

  return (
    <div style={{ "--c": area.colore }}>
      <a className="back" href={"#/area/" + area.id}><Icon n="back" />{area.nome}, {l.livello}</a>
      <h1 className="page">{l.titolo}</h1>
      <div className="lesson-meta">
        {(() => { const m = moduliOf(area).find((x) => x.id === l.modulo); return m ? <span>{m.nome}</span> : null; })()}
        {l.argomento && <span>{l.argomento}</span>}
        <span>{l.minuti || 15} minuti</span>
        <span>{es.length} esercizi</span>
        {p && <span>Miglior risultato {p.best}%</span>}
      </div>
      <Teoria md={l.teoria} />

      {vocaboli.length > 0 && (
        <>
          <h2 className="sec">Lessico</h2>
          <table className="vocab"><tbody>
            {vocaboli.map((v) => <tr key={v.de}><td>{v.de}</td><td>{v.it}{v.esempio && <span className="es">{v.esempio}</span>}</td></tr>)}
          </tbody></table>
          <div className="row" style={{ marginTop: 12 }}>
            {nuove.length ? <button className="btn small ghost" onClick={aggiungiVocaboli}>Aggiungi {nuove.length} {nuove.length === 1 ? "parola" : "parole"} al ripasso</button>
              : <span className="muted small">Tutte le parole sono già nel ripasso.</span>}
          </div>
        </>
      )}

      <h2 className="sec" id="esercizi">Esercizi</h2>
      {es.length === 0 && <p className="muted">Questa lezione non ha esercizi.</p>}
      {es.map((ex, i) => (
        <Esercizio key={i + "-" + tentativo} ex={ex} i={i} value={ans[i]} onChange={(v) => setAns((prev) => ({ ...prev, [i]: v }))}
          esito={res ? res.esiti[i] : null} voto={voti[i]} draft={draft[i]} onDraft={(t) => setDraft({ ...draft, [i]: t })}
          onVoto={() => registra(i)}
          onCopia={async () => { const ok = await copyText(promptCorrezione(area, l, ex, ans[i])); notify(ok ? "Copiato. Incollalo in una chat con Claude." : "Copia non riuscita."); }} />
      ))}

      {es.length > 0 && !res && <div className="row" style={{ marginTop: 18 }}><button className="btn" onClick={correggi}>Correggi</button></div>}

      {res && (
        <div className="result" id="risultato">
          <div className="score">{score}<small>%</small></div>
          <p style={{ margin: "10px 0 14px" }}>
            {pending > 0
              ? `${pending === 1 ? "Manca il voto di una risposta aperta" : `Mancano i voti di ${pending} risposte aperte`}: per ora conta zero.`
              : score >= o.soglia ? "Lezione superata. Il risultato conta per lo sblocco del livello successivo." : `Sotto la soglia del ${o.soglia}%. Rileggi i passaggi segnati e riprova.`}
          </p>
          <div className="row">
            <button className="btn" onClick={riprova}>Riprova</button>
            {errori.length > 0 && <button className="btn ghost" onClick={async () => { const ok = await copyText(promptErrori(area, l, errori, ans)); notify(ok ? "Copiato. Incollalo in una chat con Claude." : "Copia non riuscita."); }}>Chiedi spiegazioni a Claude</button>}
            <a className="btn ghost" href={"#/area/" + area.id}>Torna all'area</a>
          </div>
        </div>
      )}

      <div style={{ marginTop: 40 }}><button className="linkbtn" onClick={elimina}>Elimina questa lezione</button></div>
    </div>
  );
}

function Tattica({ data, apply }) {
  const [tema, setTema] = useState("mix");
  const [diff, setDiff] = useState("normal");
  const [pz, setPz] = useState(null);
  const [stato, setStato] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [sol, setSol] = useState(false);
  const carica = async () => {
    setBusy(true); setErr(""); setStato(""); setSol(false);
    try {
      if (!hasChess()) throw new Error("libreria degli scacchi non caricata");
      setPz(await fetchPuzzle(tema, diff));
    } catch (e) { setPz(null); setErr(`Non riesco a scaricare il problema da Lichess (${e.message}). Controlla la connessione e riprova.`); }
    setBusy(false);
  };
  const esito = (v) => {
    if (stato || !pz) return;
    setStato(v);
    apply({ ["tattica/" + pz.id]: { ok: v === "ok", rating: pz.rating, tema, d: today() }, ["attivita/" + today()]: true });
  };
  const tutti = Object.values(data.tattica || {});
  const risolti = tutti.filter((x) => x.ok).length;
  const ultimi = tutti.filter((x) => x.d && x.d >= addDays(today(), -30));
  const temaNome = (k) => (TEMI.find((t) => t[0] === k) || [k, k])[1];
  return (
    <div style={{ "--c": "#8A5A2B" }}>
      <a className="back" href="#/area/scacchi"><Icon n="back" />Scacchi</a>
      <h1 className="page">Allenamento tattico</h1>
      <p className="lede">Problemi dal database pubblico di Lichess, verificati da un motore. Trova la mossa migliore: conta il primo tentativo.</p>
      {tutti.length > 0 && <p className="muted small">Finora {tutti.length} {tutti.length === 1 ? "problema" : "problemi"}, {Math.round(risolti / tutti.length * 100)}% risolti. Ultimi 30 giorni: {ultimi.length}{ultimi.length ? `, ${Math.round(ultimi.filter((x) => x.ok).length / ultimi.length * 100)}% risolti` : ""}.</p>}
      <div className="grid2">
        <label className="f"><span>Tema</span><select value={tema} onChange={(e) => setTema(e.target.value)}>{TEMI.map(([k, t]) => <option key={k} value={k}>{t}</option>)}</select></label>
        <label className="f"><span>Difficoltà</span><select value={diff} onChange={(e) => setDiff(e.target.value)}>{DIFF.map(([k, t]) => <option key={k} value={k}>{t}</option>)}</select></label>
      </div>
      <div className="row"><button className="btn" disabled={busy} onClick={carica}>{busy ? "Carico…" : pz ? "Nuovo problema" : "Inizia"}</button></div>
      {err && <p className="err">{err}</p>}
      {pz && (
        <div style={{ marginTop: 18 }}>
          <div className="lesson-meta">{pz.rating && <span>Valutazione {pz.rating}</span>}{pz.temi.slice(0, 3).map((t) => <span key={t}>{temaNome(t)}</span>)}</div>
          <MossaEx key={pz.id} ex={pz} value={stato} onChange={esito} locked={false} />
          {stato && (
            <div className="row" style={{ marginTop: 12 }}>
              <button className="btn" disabled={busy} onClick={carica}>Prossimo problema</button>
              {stato !== "ok" && <button className="btn ghost" onClick={() => setSol(true)}>Mostra la soluzione</button>}
              <a className="btn ghost" href={"https://lichess.org/training/" + pz.id} target="_blank" rel="noopener">Apri su Lichess</a>
            </div>
          )}
          {sol && <p className="sol"><b>Soluzione:</b> {pz.soluzione.map(sanIt).join("  ")}</p>}
        </div>
      )}
    </div>
  );
}

function Ripasso({ data, apply, notify }) {
  const all = Object.values(data.vocab).filter((v) => v && v.de).sort((a, b) => a.de.localeCompare(b.de, "de"));
  const oggi = today();
  const due = all.filter((v) => !v.due || v.due <= oggi);
  const [sess, setSess] = useState(null);
  const [dir, setDir] = useState("de");
  const [form, setForm] = useState({ de: "", it: "", esempio: "" });
  const boxes = [1, 2, 3, 4, 5].map((b) => all.filter((v) => (v.box || 1) === b).length);
  const colors = ["#B3362B", "#C9772B", "#B89A2A", "#5B9A62", "#2C7A50"];

  const start = () => setSess({ q: shuffle(due.map((v) => v.id)).slice(0, 25), i: 0, show: false, ok: 0, ko: 0, rip: {} });
  const answer = (known) => {
    const vid = sess.q[sess.i]; const v = data.vocab[vid];
    if (v) {
      const box = known ? Math.min((v.box || 1) + 1, 5) : 1;
      apply({ ["vocab/" + vid]: { ...v, box, due: known ? addDays(oggi, INTERVALLI[box]) : addDays(oggi, 1), visto: oggi }, ["attivita/" + oggi]: true });
    }
    let q = sess.q, rip = sess.rip;
    if (!known && !rip[vid]) { q = [...q, vid]; rip = { ...rip, [vid]: true }; }
    setSess({ ...sess, q, rip, i: sess.i + 1, show: false, ok: sess.ok + (known ? 1 : 0), ko: sess.ko + (known ? 0 : 1) });
  };
  const aggiungi = () => {
    if (!form.de.trim() || !form.it.trim()) return;
    const vid = slug(form.de);
    apply({ ["vocab/" + vid]: { id: vid, de: form.de.trim(), it: form.it.trim(), esempio: form.esempio.trim(), box: 1, due: oggi, creata: oggi } });
    setForm({ de: "", it: "", esempio: "" }); notify("Parola aggiunta.");
  };

  if (sess) {
    if (sess.i >= sess.q.length) {
      return (
        <>
          <h1 className="page">Ripasso finito</h1>
          <p className="lede">{sess.ok} {sess.ok === 1 ? "risposta saputa" : "risposte sapute"}, {sess.ko} da rivedere. Le parole sbagliate tornano domani, quelle sapute più avanti.</p>
          <button className="btn" onClick={() => setSess(null)}>Chiudi</button>
        </>
      );
    }
    const v = data.vocab[sess.q[sess.i]] || { de: "?", it: "?" };
    const front = dir === "de" ? v.de : v.it, back = dir === "de" ? v.it : v.de;
    return (
      <>
        <div className="row" style={{ justifyContent: "space-between" }}>
          <span className="muted small">Carta {sess.i + 1} di {sess.q.length}</span>
          <button className="linkbtn" onClick={() => setSess(null)}>Interrompi</button>
        </div>
        <div className="card">
          <div className="front">{front}</div>
          {sess.show ? <><div className="back">{back}</div>{v.esempio && <div className="esempio">{v.esempio}</div>}</> : <div className="muted small">Pensa alla traduzione, poi girala.</div>}
        </div>
        {!sess.show
          ? <button className="btn" style={{ width: "100%" }} onClick={() => setSess({ ...sess, show: true })}>Mostra la traduzione</button>
          : <div className="grid2"><button className="btn ghost" onClick={() => answer(false)}>Non la sapevo</button><button className="btn" onClick={() => answer(true)}>La sapevo</button></div>}
      </>
    );
  }

  return (
    <>
      <h1 className="page">Ripasso</h1>
      <p className="lede">
        {all.length ? `${all.length} ${all.length === 1 ? "parola" : "parole"} nel ripasso, ${due.length} da ripassare oggi. Ogni risposta giusta sposta la parola più avanti nel tempo; ogni errore la riporta a domani.`
          : "Il ripasso si riempie con il lessico delle lezioni di tedesco: apri una lezione e premi «Aggiungi al ripasso», oppure inserisci una parola qui sotto."}
      </p>
      {all.length > 0 && (
        <>
          <div className="boxes" title="Distribuzione per scatola, dalla meno alla più consolidata">
            {boxes.map((n, k) => n > 0 && <span key={k} style={{ width: (n / all.length * 100) + "%", background: colors[k] }} />)}
          </div>
          <p className="muted small" style={{ margin: "0 0 16px" }}>A sinistra le parole appena inserite o sbagliate, a destra quelle consolidate.</p>
          <div className="row">
            <button className="btn" disabled={!due.length} onClick={start}>{due.length ? `Ripassa ${Math.min(due.length, 25)} ${Math.min(due.length, 25) === 1 ? "parola" : "parole"}` : "Niente da ripassare oggi"}</button>
            <div className="seg" style={{ margin: 0 }} role="group" aria-label="Direzione">
              <button aria-pressed={dir === "de"} onClick={() => setDir("de")}>Tedesco verso italiano</button>
              <button aria-pressed={dir === "it"} onClick={() => setDir("it")}>Italiano verso tedesco</button>
            </div>
          </div>
        </>
      )}
      <h2 className="sec">Aggiungi una parola</h2>
      <div className="grid2">
        <label className="f"><span>Tedesco</span><input value={form.de} placeholder="die Rechnung" onChange={(e) => setForm({ ...form, de: e.target.value })} autoCapitalize="off" /></label>
        <label className="f"><span>Italiano</span><input value={form.it} placeholder="la fattura" onChange={(e) => setForm({ ...form, it: e.target.value })} /></label>
      </div>
      <label className="f"><span>Frase d'esempio (facoltativa)</span><input value={form.esempio} onChange={(e) => setForm({ ...form, esempio: e.target.value })} /></label>
      <button className="btn ghost" disabled={!form.de.trim() || !form.it.trim()} onClick={aggiungi}>Aggiungi</button>
      {all.length > 0 && (
        <details style={{ marginTop: 26 }}>
          <summary>Tutte le parole ({all.length})</summary>
          <ul className="wlist">
            {all.map((v) => (
              <li key={v.id}><b>{v.de}</b><span className="muted">{v.it}</span>
                <button className="btn small ghost" aria-label={`Elimina ${v.de}`} onClick={() => { if (confirm(`Eliminare «${v.de}»?`)) apply({ ["vocab/" + v.id]: null }); }}>Elimina</button></li>
            ))}
          </ul>
        </details>
      )}
    </>
  );
}

function Contenuti({ data, param, apply, notify }) {
  const aree = areaList(data);
  const [pa, pl, pm] = String(param || "").split("/").map((x) => decodeURIComponent(x || ""));
  const [areaId, setAreaId] = useState(pa && (data.areas[pa] || pa === "nuova") ? pa : (aree[0] ? aree[0].id : "nuova"));
  const area = data.areas[areaId];
  const [livello, setLivello] = useState(pl || (area ? livelliOf(area)[0] : ""));
  const [argomento, setArgomento] = useState("");
  const [modulo, setModulo] = useState(pm || "");
  const [n, setN] = useState(1);
  const [deboli, setDeboli] = useState(true);
  const [nome, setNome] = useState("");
  const [obiettivo, setObiettivo] = useState("");
  const [txt, setTxt] = useState("");
  const [esito, setEsito] = useState(null);
  const primo = useRef(true);
  useEffect(() => {
    if (area && !livelliOf(area).includes(livello)) setLivello(livelliOf(area)[0]);
    if (primo.current) { primo.current = false; return; }
    setModulo("");
  }, [areaId]);

  const prompt = areaId === "nuova"
    ? (nome.trim() ? promptArea(data, nome.trim(), obiettivo) : "")
    : area ? promptLezioni(data, area, livello || livelliOf(area)[0], argomento, n, deboli, moduliOf(area).some((m) => m.id === modulo) ? modulo : "") : "";

  const copia = async () => { const ok = await copyText(prompt); notify(ok ? "Richiesta copiata. Incollala in una chat con Claude." : "Copia non riuscita: seleziona il testo qui sotto e copialo a mano."); };
  const importa = () => {
    try {
      const r = parseImport(txt, data);
      if (Object.keys(r.upd).length) apply(r.upd);
      setEsito(r);
      if (r.nLez || r.nAree || r.nVoc) setTxt("");
    } catch (e) { setEsito({ errors: [e.message], nLez: 0, nAree: 0, nVoc: 0, dove: [] }); }
  };

  return (
    <>
      <h1 className="page">Nuovi contenuti</h1>
      <p className="lede">Le lezioni nuove le scrive Claude. Qui prepari la richiesta, la incolli in una chat e poi importi la risposta.</p>
      <div className="steps">
        <div className="step">
          <h3>Prepara la richiesta</h3>
          <label className="f"><span>Area</span>
            <select value={areaId} onChange={(e) => setAreaId(e.target.value)}>
              {aree.map((a) => <option key={a.id} value={a.id}>{a.nome}</option>)}
              <option value="nuova">Nuova area…</option>
            </select>
          </label>
          {areaId === "nuova" ? (
            <>
              <label className="f"><span>Nome dell'area</span><input value={nome} placeholder="Per esempio: Diritto commerciale" onChange={(e) => setNome(e.target.value)} /></label>
              <label className="f"><span>Obiettivo (facoltativo)</span><input value={obiettivo} placeholder="Cosa vuoi saper fare alla fine" onChange={(e) => setObiettivo(e.target.value)} /></label>
            </>
          ) : area && (
            <>
              <div className="grid2">
                <label className="f"><span>Livello</span>
                  <select value={livello} onChange={(e) => setLivello(e.target.value)}>{livelliOf(area).map((lv) => <option key={lv}>{lv}</option>)}</select>
                </label>
                <label className="f"><span>Quante lezioni</span>
                  <select value={n} onChange={(e) => setN(Number(e.target.value))}>{[1, 2, 3].map((k) => <option key={k} value={k}>{k}</option>)}</select>
                </label>
              </div>
              {moduliOf(area).length > 0 && (
                <label className="f"><span>Modulo</span>
                  <select value={modulo} onChange={(e) => setModulo(e.target.value)}>
                    <option value="">Scelga Claude, tra i meno coperti</option>
                    {moduliOf(area).map((m) => <option key={m.id} value={m.id}>{m.nome}</option>)}
                  </select>
                </label>
              )}
              <label className="f"><span>Argomento (facoltativo)</span><input value={argomento} placeholder="Lascia vuoto e sceglie Claude" onChange={(e) => setArgomento(e.target.value)} /></label>
              <label className="check"><input type="checkbox" checked={deboli} onChange={(e) => setDeboli(e.target.checked)} />Includi i miei punti deboli in quest'area</label>
            </>
          )}
          <div className="row" style={{ marginTop: 6 }}>
            <button className="btn" disabled={!prompt} onClick={copia}>Copia la richiesta</button>
          </div>
          {prompt && <details><summary>Vedi il testo della richiesta</summary><textarea readOnly rows={10} value={prompt} style={{ fontSize: 13 }} /></details>}
        </div>
        <div className="step">
          <h3>Incollala in una chat con Claude</h3>
          <p className="muted small" style={{ margin: "0 0 10px" }}>Claude risponde con un blocco di testo che comincia con una parentesi graffa. Copialo tutto.</p>
          <a className="btn ghost small" href="https://claude.ai/new" target="_blank" rel="noopener">Apri Claude</a>
        </div>
        <div className="step">
          <h3>Importa la risposta</h3>
          <textarea rows={7} value={txt} placeholder='{"lezioni": [ ... ]}' onChange={(e) => setTxt(e.target.value)} style={{ fontFamily: "var(--mono)", fontSize: 13 }} />
          <div className="row" style={{ marginTop: 10 }}><button className="btn" disabled={!txt.trim()} onClick={importa}>Importa</button></div>
          {esito && (
            <div style={{ marginTop: 12 }}>
              {(esito.nLez > 0 || esito.nAree > 0 || esito.nVoc > 0) && (
                <p className="okmsg">
                  {[esito.nAree ? `${esito.nAree === 1 ? "Creata 1 area" : `Create ${esito.nAree} aree`}` : "", esito.nLez ? `${esito.nLez === 1 ? "aggiunta 1 lezione" : `aggiunte ${esito.nLez} lezioni`}` : "", esito.nVoc ? `${esito.nVoc} parole nel ripasso` : ""].filter(Boolean).join(", ").replace(/^./, (c) => c.toUpperCase())}.
                </p>
              )}
              {esito.dove.map((w) => <a key={w.area + w.liv} className="btn small ghost" style={{ marginRight: 8 }} href={"#/area/" + w.area}>Vai a {w.nome}, {w.liv}</a>)}
              {esito.errors.map((e, k) => <p key={k} className="err">{e}</p>)}
            </div>
          )}
        </div>
      </div>
    </>
  );
}

function Opzioni({ data, apply, notify, mode, user, auth }) {
  const o = opts(data);
  const [cfgTxt, setCfgTxt] = useState("");
  const [cfgErr, setCfgErr] = useState("");
  const [restore, setRestore] = useState("");
  const [profilo, setProfilo] = useState(o.profilo);
  const localData = mode === "cloud" ? lsGet("gradus_data") : null;

  const salvaConfig = () => {
    try { const c = parseConfigText(cfgTxt); lsSet("gradus_fbconfig", c); location.reload(); }
    catch (e) { setCfgErr(e.message); }
  };
  const scarica = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob); const a = document.createElement("a");
    a.href = url; a.download = `gradus-backup-${today()}.json`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  };
  const ripristina = () => {
    let j; try { j = JSON.parse(restore); } catch (e) { notify("Il backup non è JSON valido."); return; }
    if (!j || !j.areas || !j.lessons) { notify("Questo non sembra un backup di Gradus."); return; }
    if (!confirm("Sostituire tutti i dati attuali con il backup?")) return;
    const upd = {}; KEYS.forEach((k) => { upd[k] = j[k] && Object.keys(j[k]).length ? j[k] : null; });
    if (!upd.meta) upd.meta = { seedVersion: SEED_VERSION };
    apply(upd); setRestore(""); notify("Backup ripristinato.");
  };
  const unisciLocali = () => {
    const d = normalize(localData); const upd = {};
    ["areas", "lessons", "progress", "vocab", "attivita", "sblocchi"].forEach((k) => Object.keys(d[k]).forEach((id) => { if (!data[k][id]) upd[k + "/" + id] = d[k][id]; }));
    if (!Object.keys(upd).length) { notify("Non c'è niente di nuovo da trasferire."); return; }
    apply(upd); notify("Dati del dispositivo trasferiti nel cloud.");
  };
  const eliminaArea = (a) => {
    if (!confirm(`Eliminare l'area «${a.nome}», tutte le sue lezioni e i risultati?`)) return;
    const upd = { ["areas/" + a.id]: null, ["sblocchi/" + a.id]: null };
    lessonsOf(data, a.id).forEach((l) => { upd["lessons/" + l.id] = null; upd["progress/" + l.id] = null; });
    apply(upd);
  };
  const regole = '{\n  "rules": {\n    "gradus": {\n      ".read": "auth != null",\n      ".write": "auth != null"\n    }\n  }\n}';

  return (
    <>
      <h1 className="page">Opzioni</h1>

      <h2 className="sec">Sincronizzazione</h2>
      {mode === "cloud" ? (
        <div className="panel">
          <p style={{ marginTop: 0 }}>I dati sono salvati su Firebase e sincronizzati tra i dispositivi{user && user.email ? `, con l'account ${user.email}` : ""}.</p>
          <div className="row">
            <button className="btn ghost small" onClick={() => auth && auth.signOut()}>Esci</button>
            {!FIREBASE_CONFIG && <button className="btn ghost small" onClick={() => { if (confirm("Rimuovere la configurazione Firebase da questo dispositivo?")) { lsSet("gradus_fbconfig", null); location.reload(); } }}>Rimuovi la configurazione</button>}
            {localData && <button className="btn ghost small" onClick={unisciLocali}>Trasferisci i dati di questo dispositivo</button>}
          </div>
        </div>
      ) : (
        <div className="panel">
          <p style={{ marginTop: 0 }}>Per ora i dati restano solo su questo dispositivo. Per sincronizzarli collega un progetto Firebase gratuito:</p>
          <ol className="small" style={{ paddingLeft: 20, color: "var(--ink-2)" }}>
            <li>Su console.firebase.google.com crea un progetto.</li>
            <li>In Authentication attiva il metodo Email/password.</li>
            <li>Crea un Realtime Database (europe-west1) e incolla queste regole:</li>
          </ol>
          <pre className="code">{regole}</pre>
          <ol className="small" start={4} style={{ paddingLeft: 20, color: "var(--ink-2)" }}>
            <li>Nelle impostazioni del progetto aggiungi un'app web e copia l'oggetto firebaseConfig.</li>
            <li>Incollalo qui sotto, poi crea l'account dalla schermata di accesso.</li>
          </ol>
          <textarea rows={6} value={cfgTxt} placeholder="const firebaseConfig = { apiKey: ... }" onChange={(e) => { setCfgTxt(e.target.value); setCfgErr(""); }} style={{ fontFamily: "var(--mono)", fontSize: 13 }} />
          {cfgErr && <p className="err">{cfgErr}</p>}
          <div className="row" style={{ marginTop: 10 }}><button className="btn" disabled={!cfgTxt.trim()} onClick={salvaConfig}>Collega e ricarica</button></div>
          <p className="muted small">Prima di collegare scarica un backup: dopo l'accesso potrai trasferire nel cloud i progressi fatti su questo dispositivo.</p>
        </div>
      )}

      <h2 className="sec">Livelli</h2>
      <label className="check"><input type="checkbox" checked={o.blocco} onChange={(e) => apply({ "settings/bloccoLivelli": e.target.checked })} />Sblocca i livelli solo dopo aver superato il precedente</label>
      <label className="f" style={{ maxWidth: 240 }}><span>Soglia per superare una lezione</span>
        <select value={o.soglia} onChange={(e) => apply({ "settings/soglia": Number(e.target.value) })}>
          {[60, 65, 70, 75, 80, 85, 90].map((s) => <option key={s} value={s}>{s}%</option>)}
        </select>
      </label>

      <h2 className="sec">Profilo per le richieste a Claude</h2>
      <p className="muted small" style={{ marginTop: 0 }}>Viene inserito in ogni richiesta per tarare il livello dei contenuti.</p>
      <textarea rows={3} value={profilo} onChange={(e) => setProfilo(e.target.value)} onBlur={() => { if (profilo !== o.profilo) { apply({ "settings/profilo": profilo }); notify("Profilo salvato."); } }} />

      <h2 className="sec">Aree</h2>
      {areaList(data).map((a) => (
        <div key={a.id} className="lrow" style={{ "--c": a.colore }}>
          <span className="swatch" /><div style={{ flex: 1 }}><div>{a.nome}</div><div className="lrow-m"><span>{lessonsOf(data, a.id).length} lezioni</span><span>{livelliOf(a).join(", ")}</span></div></div>
          <button className="btn small danger" onClick={() => eliminaArea(a)}>Elimina</button>
        </div>
      ))}

      <h2 className="sec">Backup</h2>
      <div className="row"><button className="btn ghost" onClick={scarica}>Scarica il backup</button></div>
      <details style={{ marginTop: 12 }}>
        <summary>Ripristina da backup</summary>
        <textarea rows={5} value={restore} placeholder="Incolla qui il contenuto del file di backup" onChange={(e) => setRestore(e.target.value)} style={{ fontFamily: "var(--mono)", fontSize: 13 }} />
        <div className="row" style={{ marginTop: 10 }}><button className="btn" disabled={!restore.trim()} onClick={ripristina}>Ripristina</button></div>
      </details>

      <h2 className="sec">Azzera</h2>
      <button className="btn danger" onClick={() => { if (confirm("Azzerare tutti i risultati, gli sblocchi e la serie di studio? Le lezioni restano.")) apply({ progress: null, sblocchi: null, attivita: null, tattica: null }); }}>Azzera i progressi</button>
      <p className="muted small" style={{ marginTop: 30 }}>Gradus, versione contenuti {SEED_VERSION}.</p>
    </>
  );
}

function Login({ auth }) {
  const [email, setEmail] = useState(""); const [pw, setPw] = useState("");
  const [err, setErr] = useState(""); const [busy, setBusy] = useState(false);
  const run = async (crea) => {
    setErr(""); setBusy(true);
    try { if (crea) await auth.createUserWithEmailAndPassword(email.trim(), pw); else await auth.signInWithEmailAndPassword(email.trim(), pw); }
    catch (e) { setErr(authMsg(e)); }
    setBusy(false);
  };
  return (
    <div className="center">
      <div className="login">
        <div className="brand" style={{ fontSize: 40, marginBottom: 6 }}><Logo />Gradus</div>
        <p className="lede">Accedi per sincronizzare lezioni e progressi.</p>
        <label className="f"><span>Email</span><input type="email" autoComplete="email" value={email} onChange={(e) => setEmail(e.target.value)} /></label>
        <label className="f"><span>Password</span><input type="password" autoComplete="current-password" value={pw} onChange={(e) => setPw(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") run(false); }} /></label>
        {err && <p className="err">{err}</p>}
        <div className="row" style={{ marginTop: 12 }}>
          <button className="btn" disabled={busy || !email || !pw} onClick={() => run(false)}>Accedi</button>
          <button className="btn ghost" disabled={busy || !email || !pw} onClick={() => run(true)}>Crea l'account</button>
        </div>
        {!FIREBASE_CONFIG && <p style={{ marginTop: 26 }}><button className="linkbtn" onClick={() => { if (confirm("Rimuovere la configurazione Firebase e usare Gradus solo su questo dispositivo?")) { lsSet("gradus_fbconfig", null); location.reload(); } }}>Usa Gradus senza sincronizzazione</button></p>}
      </div>
    </div>
  );
}

function useRoute() {
  const parse = () => { const h = location.hash.replace(/^#\/?/, ""); const [name, ...rest] = h.split("/"); return { name: name || "oggi", param: rest.join("/") }; };
  const [r, setR] = useState(parse);
  useEffect(() => { const f = () => { setR(parse()); window.scrollTo(0, 0); }; window.addEventListener("hashchange", f); return () => window.removeEventListener("hashchange", f); }, []);
  return r;
}

/* ================= App ================= */
function App() {
  const config = useMemo(readConfig, []);
  const mode = config ? "cloud" : "local";
  const fb = useRef(null);
  const [user, setUser] = useState(undefined);
  const [data, setData] = useState(null);
  const [fail, setFail] = useState("");
  const [toast, setToast] = useState(null);
  const route = useRoute();
  const tRef = useRef(null);

  const notify = useCallback((m) => { setToast(m); clearTimeout(tRef.current); tRef.current = setTimeout(() => setToast(null), 2800); }, []);

  useEffect(() => {
    if (mode === "local") {
      const d = normalize(lsGet("gradus_data")); const u = seedUpdates(d);
      setData(u ? applyUpdates(d, u) : d); setUser(null); return;
    }
    const f = initFirebase(config);
    if (!f) { setFail("Non riesco ad avviare Firebase. Controlla la connessione o la configurazione."); return; }
    fb.current = f;
    return f.auth.onAuthStateChanged((u) => setUser(u || null));
  }, []);

  useEffect(() => {
    if (mode !== "cloud" || !user) return;
    const ref = fb.current.db.ref(ROOT);
    const h = ref.on("value", (snap) => {
      const d = normalize(snap.val()); const u = seedUpdates(d);
      if (u) ref.update(clean(u)).catch((e) => notify("Salvataggio non riuscito: " + e.message));
      setData(d);
    }, (e) => setFail("Lettura dei dati non riuscita: " + e.message + ". Controlla le regole del Realtime Database."));
    return () => ref.off("value", h);
  }, [user]);

  useEffect(() => { if (mode === "local" && data) lsSet("gradus_data", data); }, [data]);

  const apply = useCallback((upd) => {
    setData((prev) => applyUpdates(prev || normalize(null), upd));
    if (mode === "cloud" && fb.current) fb.current.db.ref(ROOT).update(clean(upd)).catch((e) => notify("Salvataggio non riuscito: " + e.message));
  }, [mode]);

  // Sblocco automatico dei livelli superati (resta sbloccato anche se aggiungi lezioni dopo)
  useEffect(() => {
    if (!data) return;
    const upd = {};
    areaList(data).forEach((a) => {
      const cur = data.sblocchi[a.id] || 0; let max = cur;
      for (let i = cur + 1; i < livelliOf(a).length; i++) { if (levelPassed(data, a, i - 1)) max = i; else break; }
      if (max > cur) upd["sblocchi/" + a.id] = max;
    });
    if (Object.keys(upd).length) apply(upd);
  }, [data]);

  if (fail) return <div className="center"><div className="brand" style={{ fontSize: 36 }}><Logo />Gradus</div><p className="lede" style={{ marginTop: 12 }}>{fail}</p><button className="btn ghost" onClick={() => location.reload()}>Riprova</button></div>;
  if (mode === "cloud" && user === undefined) return <div className="center"><div className="brand" style={{ fontSize: 36 }}><Logo />Gradus</div><p className="muted">Caricamento…</p></div>;
  if (mode === "cloud" && !user) return <Login auth={fb.current.auth} />;
  if (!data) return <div className="center"><div className="brand" style={{ fontSize: 36 }}><Logo />Gradus</div><p className="muted">Caricamento…</p></div>;

  const tab = ["area", "lezione", "tattica"].includes(route.name) ? "aree" : route.name;
  let page;
  switch (route.name) {
    case "aree": page = <Aree data={data} />; break;
    case "area": page = <Area key={route.param} data={data} id={decodeURIComponent(route.param)} apply={apply} />; break;
    case "lezione": page = <Lezione key={route.param} data={data} id={decodeURIComponent(route.param)} apply={apply} notify={notify} />; break;
    case "ripasso": page = <Ripasso data={data} apply={apply} notify={notify} />; break;
    case "tattica": page = <Tattica data={data} apply={apply} />; break;
    case "contenuti": page = <Contenuti key={route.param} data={data} param={route.param} apply={apply} notify={notify} />; break;
    case "opzioni": page = <Opzioni data={data} apply={apply} notify={notify} mode={mode} user={user} auth={fb.current && fb.current.auth} />; break;
    default: page = <Oggi data={data} />;
  }
  const nav = [["oggi", "Oggi"], ["aree", "Aree"], ["ripasso", "Ripasso"], ["contenuti", "Contenuti"], ["opzioni", "Opzioni"]];
  return (
    <>
      <header className="top">
        <div className="wrap">
          <a className="brand" href="#/oggi"><Logo />Gradus</a>
          <a className={"sync" + (mode === "cloud" ? " on" : "")} href="#/opzioni"><i />{mode === "cloud" ? "Sincronizzato" : "Solo su questo dispositivo"}</a>
        </div>
      </header>
      <main><div className="wrap">{page}</div></main>
      <nav className="bottom" aria-label="Sezioni">
        <div className="wrap">
          {nav.map(([k, t]) => <a key={k} href={"#/" + k} aria-current={tab === k ? "page" : undefined}><Icon n={k} />{t}</a>)}
        </div>
      </nav>
      {toast && <div className="toast" role="status">{toast}</div>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
